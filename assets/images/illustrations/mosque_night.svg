<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="nightGlow" cx="60" cy="45" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0A1211" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Celestial Sky / Stars Background -->
  <circle cx="60" cy="50" r="40" fill="url(#nightGlow)"/>
  
  <!-- Stars -->
  <circle cx="28" cy="24" r="1.5" fill="#E5C158" fill-opacity="0.9"/>
  <circle cx="88" cy="20" r="2.0" fill="#E5C158" fill-opacity="0.95"/>
  <circle cx="98" cy="38" r="1.2" fill="#E5C158" fill-opacity="0.7"/>
  <circle cx="20" cy="42" r="1.2" fill="#E5C158" fill-opacity="0.7"/>

  <!-- Crescent Moon in Sky -->
  <path d="M78 18 A 12 12 0 1 0 92 32 A 9.5 9.5 0 1 1 78 18 Z" fill="#E5C158"/>

  <!-- Left Minaret -->
  <rect x="24" y="46" width="7" height="44" rx="1.5" fill="currentColor" fill-opacity="0.85"/>
  <polygon points="27.5,34 23,46 32,46" fill="currentColor"/>
  <circle cx="27.5" cy="32" r="1.8" fill="#E5C158"/>

  <!-- Right Minaret -->
  <rect x="89" y="46" width="7" height="44" rx="1.5" fill="currentColor" fill-opacity="0.85"/>
  <polygon points="92.5,34 88,46 97,46" fill="currentColor"/>
  <circle cx="92.5" cy="32" r="1.8" fill="#E5C158"/>

  <!-- Mosque Building -->
  <rect x="35" y="58" width="50" height="32" rx="3" fill="currentColor" fill-opacity="0.95"/>
  
  <!-- Central Dome -->
  <path d="M43 58 C43 38, 77 38, 77 58 Z" fill="currentColor"/>
  <line x1="60" y1="38" x2="60" y2="28" stroke="#E5C158" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="26" r="2.2" fill="#E5C158"/>

  <!-- Glowing Arch Windows -->
  <path d="M53 90 V74 C53 69, 67 69, 67 74 V90 Z" fill="#E5C158" fill-opacity="0.85"/>
  <path d="M40 76 V68 C40 65, 46 65, 46 68 V76 Z" fill="#E5C158" fill-opacity="0.6"/>
  <path d="M74 76 V68 C74 65, 80 65, 80 68 V76 Z" fill="#E5C158" fill-opacity="0.6"/>

  <!-- Foundation -->
  <rect x="16" y="90" width="88" height="3" rx="1.5" fill="#E5C158" fill-opacity="0.6"/>
</svg>
