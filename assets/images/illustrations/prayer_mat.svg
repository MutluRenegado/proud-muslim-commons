<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="matGlow" cx="60" cy="60" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="60" cy="60" r="42" fill="url(#matGlow)"/>

  <!-- Top Tassels / Fringe -->
  <line x1="38" y1="20" x2="38" y2="25" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="20" x2="44" y2="25" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="50" y2="25" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="56" y1="20" x2="56" y2="25" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="64" y1="20" x2="64" y2="25" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="20" x2="70" y2="25" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="76" y1="20" x2="76" y2="25" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="82" y1="20" x2="82" y2="25" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Main Rug Body -->
  <rect x="34" y="25" width="52" height="70" rx="3" fill="currentColor" fill-opacity="0.9"/>
  <!-- Gold Outer Border -->
  <rect x="36" y="27" width="48" height="66" rx="2" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
  
  <!-- Inner Carpet Field -->
  <rect x="40" y="31" width="40" height="58" rx="1.5" fill="currentColor" fill-opacity="0.3"/>
  <rect x="40" y="31" width="40" height="58" rx="1.5" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="0.8" fill="none"/>

  <!-- Mihrab Arch (Prayer Niche) -->
  <path d="M44 80 V52 C44 42, 76 42, 76 52 V80 Z" fill="#D4AF37" fill-opacity="0.2" stroke="#D4AF37" stroke-width="1.2"/>
  <!-- Arch Peak Motif -->
  <polygon points="60,38 64,44 56,44" fill="#D4AF37"/>
  <circle cx="60" cy="35" r="1.8" fill="#D4AF37"/>

  <!-- Hanging Mosque Lamp Motif -->
  <line x1="60" y1="44" x2="60" y2="52" stroke="#D4AF37" stroke-width="1"/>
  <ellipse cx="60" cy="55" rx="3" ry="4" fill="#FFD54F"/>
  <circle cx="60" cy="55" r="1.2" fill="#FFFFFF"/>

  <!-- Geometric Center Star on Rug -->
  <polygon points="60,66 62,71 67,71 63,74 65,79 60,76 55,79 57,74 53,71 58,71" fill="#D4AF37"/>

  <!-- Bottom Tassels / Fringe -->
  <line x1="38" y1="95" x2="38" y2="100" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="95" x2="44" y2="100" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="50" y1="95" x2="50" y2="100" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="56" y1="95" x2="56" y2="100" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="64" y1="95" x2="64" y2="100" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="95" x2="70" y2="100" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="76" y1="95" x2="76" y2="100" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="82" y1="95" x2="82" y2="100" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
</svg>
