<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="dawnSky" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD180" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#FFA726" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#26A69A" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="60" y1="30" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Sun / Horizon Glow -->
  <circle cx="60" cy="58" r="32" fill="url(#sunGlow)"/>
  
  <!-- Minaret Left -->
  <rect x="22" y="44" width="8" height="46" rx="2" fill="currentColor" fill-opacity="0.85"/>
  <polygon points="26,30 21,44 31,44" fill="currentColor"/>
  <circle cx="26" cy="28" r="2" fill="#D4AF37"/>
  <rect x="20" y="58" width="12" height="3" rx="1.5" fill="#D4AF37"/>

  <!-- Minaret Right -->
  <rect x="90" y="44" width="8" height="46" rx="2" fill="currentColor" fill-opacity="0.85"/>
  <polygon points="94,30 89,44 99,44" fill="currentColor"/>
  <circle cx="94" cy="28" r="2" fill="#D4AF37"/>
  <rect x="88" y="58" width="12" height="3" rx="1.5" fill="#D4AF37"/>

  <!-- Central Mosque Base -->
  <rect x="34" y="56" width="52" height="34" rx="3" fill="currentColor" fill-opacity="0.95"/>
  
  <!-- Main Dome -->
  <path d="M42 56 C42 34, 78 34, 78 56 Z" fill="currentColor"/>
  <!-- Dome Finial / Crescent -->
  <line x1="60" y1="34" x2="60" y2="24" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="22" r="2.5" fill="#D4AF37"/>

  <!-- Main Arch Entrance -->
  <path d="M52 90 V72 C52 66, 68 66, 68 72 V90 Z" fill="#D4AF37" fill-opacity="0.9"/>
  
  <!-- Small Windows -->
  <path d="M38 74 V66 C38 62, 44 62, 44 66 V74 Z" fill="#FFD54F" fill-opacity="0.7"/>
  <path d="M76 74 V66 C76 62, 82 62, 82 66 V74 Z" fill="#FFD54F" fill-opacity="0.7"/>

  <!-- Ground Line -->
  <rect x="14" y="90" width="92" height="4" rx="2" fill="#D4AF37" fill-opacity="0.7"/>
</svg>
