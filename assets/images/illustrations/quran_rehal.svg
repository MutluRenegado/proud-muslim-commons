  <line x1="30" y1="56" x2="52" y2="61" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="68" y1="57" x2="90" y2="52" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="68" y1="61" x2="90" y2="56" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>

