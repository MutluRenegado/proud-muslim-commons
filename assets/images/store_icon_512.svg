<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083821"/>
      <stop offset="50%" stop-color="#0F5132"/>
      <stop offset="100%" stop-color="#146C43"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29C"/>
      <stop offset="50%" stop-color="#DFBA45"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#DFBA45" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F5132" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Islamic Geometric Pattern Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- Noor Radial Ambient Glow -->
  <circle cx="256" cy="230" r="170" fill="url(#lightGlow)"/>

  <!-- Mihrab / Islamic Arch Portal Motif -->
  <path d="M 170 380 L 170 240 C 170 160, 256 120, 256 120 C 256 120, 342 160, 342 240 L 342 380 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)" opacity="0.85"/>

  <!-- Inner Elegant Crescent & 8-Point Noor Star -->
  <g transform="translate(256, 240) scale(1.15)" filter="url(#dropShadow)">
    <!-- Crescent Moon -->
    <path d="M 0 -70 A 70 70 0 1 0 55 45 A 58 58 0 1 1 0 -70 Z"
          fill="url(#goldGrad)"/>

    <!-- Noor 8-Point Star of Guidance -->
    <path d="M 28 -38 L 33 -26 L 45 -30 L 39 -19 L 49 -10 L 37 -6 L 39 6 L 28 0 L 22 11 L 18 -1 L 6 0 L 14 -10 L 6 -18 L 18 -16 L 20 -28 Z"
          fill="#FFF8E7"/>
  </g>

  <!-- Subtle Noor Ray Lines at Base -->
  <line x1="210" y1="360" x2="302" y2="360" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="230" y1="372" x2="282" y2="372" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
